[project]
name = "bnpl"
version = "0.1.0"
description = "Track Buy Now, Pay Later purchases, instalments and debt"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
bnpl = "bnpl.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
